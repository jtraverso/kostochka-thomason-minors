    statements and definitions in the Challenge and the Solution.

fidelity:
  divergences: >-
    Graphs are Mathlib SimpleGraphs on a nonempty finite vertex type; the hypothesis |E|/|V| ≥ d is
    stated as d·|V| ≤ |E| with d a natural number. A K_t minor is a branch-set model: t disjoint,
    nonempty, connected vertex sets with an edge between every two of them. ln is Real.log and
    √ is Real.sqrt; "sufficiently large d" is an existential threshold d0. In kostochka_thomason
    the constant c is existential and the bound is stated for every d ≥ 2.

